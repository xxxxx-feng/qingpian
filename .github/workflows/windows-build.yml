name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'build_windows.py'
      - 'packaged_entry.py'
      - 'verify_windows.py'
      - 'publish_windows_draft.py'
      - 'requirements-windows-build.txt'
      - 'photo_tool/**'
      - 'tests/**'
      - 'generate_notices.py'
      - 'VERSION'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  windows-x64:
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned Windows build dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-windows-build.txt
      - name: Run the photo and GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Collect licenses for the actual Windows wheels
        run: python generate_notices.py
      - name: Build the Windows x64 portable ZIP
        run: python build_windows.py
      - name: Verify extracted ZIP, AMD64 executable and native packaged GUI
        run: python verify_windows.py
      - name: Upload verified Windows files to a draft release
        env:
          QINGPIAN_RELEASE_TOKEN: ${{ github.token }}
        run: python publish_windows_draft.py
      - name: Upload verified Windows release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qingpian-windows-x64
          path: |
            dist/windows-x64/*.zip
            dist/windows-x64/*SHA256SUMS.txt
            dist/windows-x64/windows-verification.json
            dist/windows-x64/windows-packaged-gui.png
          if-no-files-found: error
          retention-days: 14
